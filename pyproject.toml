[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rodski"
version = "6.7.8"
description = "RodSki - AI Agent 跨平台确定性测试执行引擎"
requires-python = ">=3.8"
dependencies = [
    "xmlschema>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "psutil>=5.9",
    "requests>=2.28",
]

[project.scripts]
rodski = "rodski.rodski_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rodski*"]
exclude = ["rodski/tests*", "rodski/docs*", "rodski/examples*", "rodski/scripts*"]

[tool.setuptools.package-data]
"rodski.schemas" = ["*.xsd"]

[tool.black]
line-length = 120
target-version = ['py38']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120

[tool.coverage.run]
source = ["rodski"]
omit = ["*/tests/*", "*/demo_*/*"]

[tool.coverage.report]
fail_under = 80
precision = 2
