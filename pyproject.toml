[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rodski"
version = "7.2.0"
description = "RodSki - AI Agent 跨平台确定性测试执行引擎"
requires-python = ">=3.8"
dependencies = [
    "xmlschema>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "psutil>=5.9",
    "requests>=2.28",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# v7.1.0 perception 插件（LocalPerceptionBackend，基于本地 ollama + Qwen3-VL）。
# 通过 entry_points group "rodski.perception_backends" 自动注册；rodski
# 核心 import 时不会触发该包加载。未来扩展：
#   perception-remote = ["rodski-omni-client>=0.1.0"]
perception = ["rodski-perception>=0.2.0"]

[project.scripts]
rodski = "rodski.rodski_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rodski", "rodski.*"]
exclude = ["rodski.tests*", "rodski.docs*", "rodski.examples*", "rodski.scripts*"]

[tool.setuptools.package-data]
"rodski.schemas" = ["*.xsd"]

[tool.black]
line-length = 120
target-version = ['py38']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120

[tool.coverage.run]
source = ["rodski"]
omit = ["*/tests/*", "*/demo_*/*"]

[tool.coverage.report]
fail_under = 80
precision = 2
