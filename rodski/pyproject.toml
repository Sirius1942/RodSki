# ============================================================
# DEPRECATED: This file is for local dev-install only.
# The sole release entry point is the root /pyproject.toml.
# Do NOT use this file for building release wheels/sdists.
# ============================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rodski"
version = "8.0.2"
description = "RodSki 关键字驱动自动化测试框架 (DEV-ONLY, see root pyproject.toml)"
requires-python = ">=3.8"

[project.optional-dependencies]
# 与根 pyproject.toml 保持一致；详见 §2.6.6
perception = ["rodski-perception>=0.2.0"]
load = ["locust>=2.28.0,<3.0"]

[project.scripts]
rodski = "rodski_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "builtin_ops*",
    "config*",
    "core*",
    "data*",
    "drivers*",
    "llm*",
    "load*",
    "observability*",
    "report*",
    "reviewers*",
    "rodski_cli*",
    "rodski_docs*",
    "schemas*",
    "ui*",
    "utils*",
    "vision*",
]
exclude = ["tests*", "docs*", "examples*", "scripts*"]

[tool.setuptools.package-data]
schemas = ["*.xsd"]

[tool.black]
line-length = 120
target-version = ['py38']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120

[tool.coverage.run]
source = ["rodski"]
omit = ["*/tests/*", "*/demo_*/*"]

[tool.coverage.report]
fail_under = 80
precision = 2
