[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rodski"
version = "6.7.2"
description = "RodSki 关键字驱动自动化测试框架"
requires-python = ">=3.8"

[project.scripts]
rodski = "rodski_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "builtin_ops*",
    "config*",
    "core*",
    "data*",
    "drivers*",
    "llm*",
    "observability*",
    "report*",
    "reviewers*",
    "rodski_cli*",
    "rodski_docs*",
    "schemas*",
    "ui*",
    "utils*",
    "vision*",
]
exclude = ["tests*", "docs*", "examples*", "scripts*"]

[tool.setuptools.package-data]
schemas = ["*.xsd"]

[tool.black]
line-length = 120
target-version = ['py38']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120

[tool.coverage.run]
source = ["rodski"]
omit = ["*/tests/*", "*/demo_*/*"]

[tool.coverage.report]
fail_under = 80
precision = 2
