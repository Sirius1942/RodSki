<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>F026 Specials</title></head>
<body>
<!-- 输入框预填 keepN：type 对 BLANK/NULL/NONE/空值 的字段应"跳过"（不输入），预填值保持不变 -->
<input id="f1" value="keep1"><input id="f2" value="keep2"><input id="f3" value="keep3">
<input id="f4" value="keep4"><input id="f5" value="keep5">
<button id="dumpBtn" onclick="var a=[];for(var i=1;i<=5;i++){a.push('f'+i+'='+document.getElementById('f'+i).value);}document.getElementById('dump').textContent=a.join('|');">dump</button>
<div id="dump"></div>
<span id="t1">AAA</span><span id="t2">BBB</span><span id="t3">CCC</span>
</body></html>
