<!doctype html>
<html><head><meta charset="utf-8"><title>late_get</title><script src="common.js"></script></head><body>
<h1>文本延迟出现 <small id="delayInfo"></small></h1>
<!-- 时间线：#refText 立即显示参考值；d 毫秒后插入 #lateText（内容与参考值相同）。
     用例：get 读取 #lateText → verify #refText 等于 ${Return[-1].xxx}（get 读到 None 时比对失败） -->
<div>参考值：<span id="refText">订单号-A7K9</span></div>
<div id="box"></div>
<script>
AW.at(AW.ms('d', 2000), function () { AW.add('box', 'span', { id: 'lateText' }, '订单号-A7K9'); });
</script>
</body></html>
