<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位器测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .section h3 {
            color: #333;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .section p {
            color: #666;
            font-size: 13px;
            margin-bottom: 8px;
        }
        input, textarea {
            padding: 10px 14px;
            width: 100%;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .xpath-test {
            padding: 10px;
            background: #fff;
            border-radius: 6px;
        }
        .xpath-inner {
            padding: 10px;
        }
        a {
            color: #667eea;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }
        a:hover { text-decoration: underline; }
        button {
            padding: 12px 24px;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: opacity 0.3s;
        }
        button:hover { opacity: 0.9; }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            min-height: 40px;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #667eea;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>定位器测试</h1>

        <div class="section">
            <h3>1. ID 定位</h3>
            <p>通过 id 属性定位元素</p>
            <input id="input_by_id" placeholder="ID定位" />
            <button id="btn_by_id" onclick="document.getElementById('result').textContent='测试结果: ID 定位器测试成功！'">提交</button>
        </div>

        <div class="section">
            <h3>2. Name 定位</h3>
            <p>通过 name 属性定位元素</p>
            <input name="input_by_name" placeholder="Name定位" />
            <button name="btn_by_name" onclick="document.getElementById('result').textContent='测试结果: Name 定位器测试成功！'">提交</button>
        </div>

        <div class="section">
            <h3>3. CSS 定位</h3>
            <p>通过 CSS class 定位元素</p>
            <input class="input-css-test" placeholder="CSS定位" />
            <button class="btn-css-test" onclick="document.getElementById('result').textContent='测试结果: CSS 定位器测试成功！'">提交</button>
        </div>

        <div class="section">
            <h3>4. XPath 定位</h3>
            <p>通过 XPath 定位元素</p>
            <input data-testid="input-xpath" placeholder="XPath定位" />
            <button data-testid="btn-xpath" onclick="document.getElementById('result').textContent='测试结果: XPath 定位器测试成功！'">提交</button>
        </div>

        <div class="section" style="margin-top: 800px;">
            <h3>5. 滚动点击</h3>
            <p>需要滚动才能看到的按钮</p>
            <button id="btn_below_fold" onclick="document.getElementById('result').textContent='测试结果: ScrollClick 定位器测试成功！'">滚动点击</button>
        </div>

        <div id="result" class="result"></div>

        <button id="locatorSubmitBtn" onclick="collectValues()">提交全部</button>
        <div id="locatorResult" class="result"></div>

        <a href="/" class="back-link">返回首页</a>
    </div>

    <script>
        function collectValues() {
            const idVal = document.getElementById('input_by_id').value;
            const nameVal = document.querySelector('[name="input_by_name"]').value;
            const cssVal = document.querySelector('.input-css-test').value;
            const xpathVal = document.querySelector('[data-testid="input-xpath"]').value;

            document.getElementById('locatorResult').textContent = [
                `ID定位: ${idVal}`,
                `Name定位: ${nameVal}`,
                `CSS定位: ${cssVal}`,
                `XPath定位: ${xpathVal}`,
            ].join('\n');
        }
    </script>
</body>
</html>
